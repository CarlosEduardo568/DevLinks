<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>DevLinks</title>
  </head>
  <body>

    <style>
      /* Configurações Gerais */

      body {
        background: #EEAECA;
        background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);

        font-family: 'Inter', sans-serif; /* Usando a fonte que você importou */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; 
      }

      @media (max-width: 768px){
        body{
          background: #EEAECA;
        background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
        }

      }

      #container {
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);

        border-radius: 16px;
        width: 40%;
        max-width: 588px;
        margin: 50px auto;
        padding: 0 24px;
        text-align: center;

        box-shadow: 8px 8px 9px rgb(105, 136, 250);
      }

      /* medidas para mobile*/
      @media (max-width: 768px){
        #container{
          display: flex;
          flex-direction: column;
          width: 60%;
          padding: 15px;
        }
        }

        .links {
          display: flex;
          align-items: center;
          justify-content: center;
          
          background:  rgba(0, 139, 209, 0.1);
          color: white;
          text-decoration: none; /* Remove o sublinhado do link */
          
          width: 100%;
          max-width: 300px;
          height: 50px;
          margin: 0 auto;
          
          border-radius: 8px;
          font-size: 18px;
          font-weight: 500;
          transition: background 0.2s;
        }

        .links:hover {
          background: #003047; /* Efeito de cor ao passar o mouse */

          display: flex;
          align-items: center;
          justify-content: center;

          width: 100%;
          max-width: 300px;
          height: 50px;
          margin: 0 auto;

          border-radius: 8px;
          font-size: 18px;
          font-weight: 500;
          transition: 0.5s ease;
          transform:scale(1.05);
        }

        #botao-tema{
          background-image: url(./assets/sun.svg);

          width: 30px;
          height: 30px; 

          background-size: cover;
          background-position: center;

          border-radius: 30px;
          border: none;
          cursor: pointer;

          display: block;
          margin-top: 20px;
          margin-right: 0;
          margin-left: auto;
        }

        #botao-tema:hover{
            transform:scale(1.05);
            opacity: 0.9;
          
        }

        #texto-perfil:hover{
          background: #fc0015;
          background: linear-gradient(90deg, rgba(252, 0, 21, 1) 0%, rgba(68, 0, 255, 1) 53%, rgba(0, 140, 247, 1) 100%);

          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;

          font-size: 20px;
          font-weight: 500;
          margin-top: 8px;
          margin-bottom: 24px;
          transition: 0.7s ease;
          transform: scale(1.1);

        }
    </style>
    
    <div id="container">

      <a id="botao-tema" href="index.html"></a>

      <br><br> <br>
      <div id="profile">
        <img  id="imagem-maxwellcat" src="assets/avatar.jpg">
        </div>
        <p id="texto-perfil">Gamerk325</p>
      <br>
     
      <ul>
        <div class="links">
            <a class="links" href="https://github.com/CarlosEduardo568" target="_blank">Me siga!</a>
        </div>
 <br>
          <div class="links">

            <a class="links" href="https://github.com/CarlosEduardo568?tab=repositories" target="_blank">Veja meu portifólio</a>
          </div>

<br>
         <div class="links">
          <a class="links" href="https://br.linkedin.com/" target="_blank">Acesse meu Linkedin</a>
         </div>

        <br>
        <div class="links">
          <a class="links" download="Curriculo_Adriel">Baixe meu currículo</a>
        </div>

      </ul>

      <br><br> <br>
    </div>
  </body>
</html>
